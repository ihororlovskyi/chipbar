name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tests
        env:
          TEST_RUNNER_CI: "true"
        run: |
          xcodebuild test \
            -project sysbar.xcodeproj \
            -scheme sysbar \
            -destination 'platform=macOS,arch=arm64'

      - name: Compute version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release
        id: build
        run: |
          ./scripts/build-release.sh "${{ steps.ver.outputs.version }}"
          SHA=$(shasum -a 256 "build/sysbar-${{ steps.ver.outputs.version }}.zip" | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "build/sysbar-${{ steps.ver.outputs.version }}.zip" \
            --generate-notes \
            --title "sysbar ${{ github.ref_name }}"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v5
        with:
          repository: ihororlovskyi/homebrew-tap
          token: ${{ secrets.GH_TAP_PAT }}
          path: homebrew-tap

      - name: Update cask
        run: |
          CASK="homebrew-tap/Casks/sysbar.rb"
          if [ ! -f "$CASK" ]; then
            echo "::warning::$CASK not found; skipping cask update (expected on the first sysbar release)"
            exit 0
          fi
          ./scripts/update-cask.sh \
            "${{ steps.ver.outputs.version }}" \
            "${{ steps.build.outputs.sha }}" \
            "$CASK"

      - name: Push tap update
        working-directory: homebrew-tap
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "::warning::no cask changes to push"
            exit 0
          fi
          git config user.name  "sysbar-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Casks/sysbar.rb
          git commit -m "sysbar: ${{ steps.ver.outputs.version }}"
          git push
